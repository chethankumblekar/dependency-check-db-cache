name: CI

# Actions are pinned to commit SHAs. The trailing comment is the release tag.
# Update a pin with: gh api repos/<owner>/<name>/commits/<tag> --jq .sha
# Replace the SHA and the tag comment in the same change.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel a superseded run. A push can be publishing images,
  # so it is left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One Trivy release for every gate. trivy-action v0.36.0 used this one.
  TRIVY_VERSION: v0.70.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          # A Maven Central 502 failed main on 19 October. The cache means a
          # transient outage no longer stops a build that resolved before.
          cache: maven
          cache-dependency-path: integrations/maven/pom.xml

      - name: Install lint and build tools
        # Versions live in pyproject.toml. A reviewed bump of ruff or build
        # updates that file; this step installs the same pins.
        run: python3 -m pip install --disable-pip-version-check '.[dev]'

      - name: Lint, build, and test
        run: bash ./scripts/self-test.sh

  windows:
    name: Windows
    # The Windows client, the msvcrt lock, and setup.ps1 run here on a real
    # Windows runner, ending in a scan against the published signed snapshot.
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Portable unit tests
        run: |
          python -m pip install --disable-pip-version-check ".[dev]"
          python -m unittest -v tests.test_scan_safety tests.test_snapshot_resilience tests.test_key_management tests.test_match_regressions tests.test_server_hardening tests.test_score

      - name: Put gpg on PATH
        # Git for Windows ships gpg. Only gpg goes on PATH, through a shim:
        # adding Git's usr\bin would also put GNU tar ahead of Windows' tar.exe.
        # The GnuPG for Windows installer hung on the hosted runner, even
        # with only its own process waited on.
        timeout-minutes: 2
        run: |
          $gpg = "C:\Program Files\Git\usr\bin\gpg.exe"
          if (-not (Test-Path $gpg)) { throw "Git for Windows gpg is not on this runner." }
          $shim = Join-Path $env:RUNNER_TEMP "gpg-shim"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Set-Content -Path (Join-Path $shim "gpg.cmd") -Value "@`"$gpg`" %*" -Encoding ascii
          Add-Content -Path $env:GITHUB_PATH -Value $shim
          & $gpg --version | Select-Object -First 1

      - name: Install with setup.ps1
        timeout-minutes: 15
        env:
          # The branch this run is for. setup.ps1 installs the package from it.
          CHECKSTEAD_REF: ${{ github.head_ref || github.ref_name }}
          CHECKSTEAD_INSTALL_RUNTIMES: "1"
        run: |
          ./scripts/setup.ps1
          $exe = Join-Path $env:USERPROFILE "checkstead\venv\Scripts\checkstead.exe"
          & $exe version
          & $exe doctor
          $lib = Join-Path $env:USERPROFILE "checkstead\dependency-check\lib"
          $expected = @{
            "jackson-core-2.22.1.jar" = "8a501126a385b25841915d839508f8a66e2a0dbc8a6709d055ef3b3e852b094c"
            "jackson-databind-2.22.1.jar" = "556db5439e206114346043f68d200497dc96a0bca62a360a81784092ebd0e0a9"
            "jsoup-1.23.1.jar" = "e9d8c856856680427f096d156f02a414289985c930998fcb519ce5be39b42003"
          }
          foreach ($name in $expected.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $lib $name)).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$name]) { throw "$name was not replaced: $actual" }
          }
          if (-not (Test-Path (Join-Path $env:USERPROFILE "checkstead\jdk\bin\java.exe"))) { throw "The pinned JDK was not installed." }
          if (-not (Test-Path (Join-Path $env:USERPROFILE "checkstead\python\python.exe"))) { throw "The pinned Python was not installed." }

      - name: Scan with the published signed snapshot
        timeout-minutes: 15
        run: |
          $exe = Join-Path $env:USERPROFILE "checkstead\venv\Scripts\checkstead.exe"
          $env:JAVA_HOME = Join-Path $env:USERPROFILE "checkstead\jdk"
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          $project = Join-Path $env:RUNNER_TEMP "canary"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          $jar = Join-Path $project "commons-collections-3.2.1.jar"
          Invoke-WebRequest -Uri "https://repo1.maven.org/maven2/commons-collections/commons-collections/3.2.1/commons-collections-3.2.1.jar" -OutFile $jar
          if ((Get-FileHash -Algorithm SHA256 $jar).Hash.ToLowerInvariant() -ne "87363a4c94eaabeefd8b930cb059f66b64c9f7d632862f23de3012da7660047b") { throw "canary jar digest" }
          $env:CHECKSTEAD_UNTRUSTED_SOURCE = "1"
          $output = & $exe scan --scan $project --project windows-canary --out (Join-Path $env:RUNNER_TEMP "report") 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { throw "scan exited $LASTEXITCODE" }
          if ($output -notmatch "snapshot-authenticity: signed key=checkstead-2026-10") { throw "the snapshot was not verified as signed" }
          if ($output -notmatch "CVE-2015-6420") { throw "the scan did not report CVE-2015-6420" }

  images:
    name: Build images
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: checkstead
            kind: scanner
            file: Dockerfile
          - image: checkstead-server
            kind: server
            file: Dockerfile.server
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ matrix.image }}:ci

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Image gates
        run: bash ./scripts/image-gates.sh "${{ matrix.kind }}" "${{ matrix.image }}:ci" build/trivy

      - name: Smoke test the image
        run: bash ./scripts/smoke-image.sh "${{ matrix.kind }}" "${{ matrix.image }}:ci"

      - name: Upload the image reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.image }}
          path: build/trivy/

  publish-images:
    name: Publish images
    # Pull requests never reach this job. A branch push other than the default
    # branch does not publish either. Version tags and the default branch do.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: checkstead
            kind: scanner
            file: Dockerfile
            engine: true
            platforms: linux/amd64
          - image: checkstead-server
            kind: server
            file: Dockerfile.server
            engine: false
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read the engine pin and the image name
        id: pin
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          echo "version=$(tr -d '[:space:]' < engine.version)" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "ghcr.io/${GITHUB_REPOSITORY}/${IMAGE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.pin.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=engine-${{ steps.pin.outputs.version }},enable=${{ matrix.engine && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Only the immutable sha- tag is pushed here. latest, the version tags,
      # and engine-<pin> move to this digest after the gates pass on it.
      - name: Build and push the candidate
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.pin.outputs.name }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # A release tag is built without the layer cache, so nothing a
          # branch build left in the cache ends up in a release image.
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,scope={0}', matrix.image) || '' }}
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # The gates run on the digest that was pushed, for every platform it
      # contains. This is the artifact the tags below will name.
      - name: Image gates on the pushed digest
        env:
          PLATFORMS: ${{ matrix.platforms }}
        run: bash ./scripts/image-gates.sh "${{ matrix.kind }}" "${{ steps.pin.outputs.name }}@${{ steps.push.outputs.digest }}" build/trivy

      - name: Upload the image reports and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.image }}-${{ github.sha }}
          path: build/trivy/

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.pin.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # The action defaults this to false, which stores the statement only
          # in the GitHub API. Container verification also needs it on the image.
          push-to-registry: true

      - name: Verify the GitHub provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.pin.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          set -eu
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify "oci://${IMAGE}" --repo "${GITHUB_REPOSITORY}"; then
              ok=1
              break
            fi
            sleep $((attempt * 10))
          done
          test "$ok" = 1

      - name: Promote the gated digest
        env:
          IMAGE: ${{ steps.pin.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=("$tag")
          done <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "$tag")
          done
          # imagetools create copies the index by digest. The tags name the
          # same bytes the gates scanned and the attestation covers.
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for tag in "${tags[@]}"; do
            actual=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            if [[ "$actual" != "$DIGEST" ]]; then
              echo "Tag ${tag} names ${actual}, not the gated ${DIGEST}." >&2
              exit 1
            fi
          done
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest \`${DIGEST}\` passed the image gates and is attested."
            echo
            echo '```'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
