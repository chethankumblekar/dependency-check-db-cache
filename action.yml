name: "Checkstead"
description: "Scan with the pinned OWASP Dependency-Check and the Checkstead snapshot. No NVD API key."
inputs:
  scan:
    description: "Path to scan, relative to the workspace."
    required: false
    default: "."
  project:
    description: "Name written on the report. Defaults to the directory name."
    required: false
    default: ""
  output:
    description: "Directory for the Checkstead report and the Dependency-Check reports."
    required: false
    default: "checkstead-report"
  config:
    description: "Optional path to checkstead.yml. When omitted, ./checkstead.yml is used if it exists."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      env:
        INPUT_SCAN: ${{ inputs.scan }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_CONFIG: ${{ inputs.config }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        docker build -t checkstead-action -f "$GITHUB_ACTION_PATH/Dockerfile" "$GITHUB_ACTION_PATH"
        author_name="$(git -c safe.directory='*' -C "$GITHUB_WORKSPACE" log -1 --format='%an' "$GITHUB_SHA" 2>/dev/null || true)"
        author_email="$(git -c safe.directory='*' -C "$GITHUB_WORKSPACE" log -1 --format='%ae' "$GITHUB_SHA" 2>/dev/null || true)"
        if [[ -n "${PR_NUMBER:-}" && -n "${BASE_SHA:-}" && -n "${HEAD_SHA:-}" ]]; then
          work="${RUNNER_TEMP:-/tmp}/checkstead-pr-${PR_NUMBER}"
          rm -rf "$work"
          mkdir -p "$work/head" "$work/base"
          GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin "$BASE_SHA"
          GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          git archive "$HEAD_SHA" | tar -x -C "$work/head"
          git archive "$BASE_SHA" | tar -x -C "$work/base"
          rel="${INPUT_SCAN#./}"
          rel="${rel%/}"
          if [[ -z "$rel" || "$rel" == "." ]]; then
            head_scan="/head"
            base_scan="/base"
            have_base=1
          else
            head_scan="/head/${rel}"
            base_scan="/base/${rel}"
            if [[ -e "$work/base/${rel}" ]]; then
              have_base=1
            else
              have_base=0
            fi
          fi
          scan_args=(scan --scan "$head_scan" --out /out --pull-request "$PR_NUMBER")
          if [[ "$have_base" == 1 ]]; then
            scan_args+=(--base "$base_scan")
          fi
          if [[ -n "${INPUT_PROJECT:-}" ]]; then
            scan_args+=(--project "$INPUT_PROJECT")
          fi
          if [[ -n "${INPUT_CONFIG:-}" ]]; then
            cfg="${INPUT_CONFIG#./}"
            scan_args+=(--config "/head/${cfg}")
          fi
          if [[ -n "${GITHUB_REF_NAME:-}" ]]; then
            scan_args+=(--branch "$GITHUB_REF_NAME")
          fi
          if [[ -n "${GITHUB_SHA:-}" ]]; then
            scan_args+=(--revision "$GITHUB_SHA")
          fi
          if [[ -n "$author_name" ]]; then
            scan_args+=(--author "$author_name")
          fi
          if [[ -n "$author_email" ]]; then
            scan_args+=(--author-email "$author_email")
          fi
          mkdir -p "${GITHUB_WORKSPACE}/${INPUT_OUTPUT}"
          docker run --rm \
            -v "$work/head:/head" \
            -v "$work/base:/base" \
            -v "${GITHUB_WORKSPACE}/${INPUT_OUTPUT}:/out" \
            -w /head \
            -e GITHUB_REF_NAME \
            -e GITHUB_SHA \
            -e CHECKSTEAD_AUTHOR="$author_name" \
            -e CHECKSTEAD_AUTHOR_EMAIL="$author_email" \
            checkstead-action "${scan_args[@]}"
        else
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e INPUT_SCAN \
            -e INPUT_PROJECT \
            -e INPUT_OUTPUT \
            -e INPUT_CONFIG \
            -e GITHUB_REF_NAME \
            -e GITHUB_SHA \
            -e CHECKSTEAD_AUTHOR="$author_name" \
            -e CHECKSTEAD_AUTHOR_EMAIL="$author_email" \
            checkstead-action
        fi
    - name: Comment on the pull request
      if: always() && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_FILE: ${{ github.workspace }}/${{ inputs.output }}/checkstead-comment.md
      run: python3 "$GITHUB_ACTION_PATH/scripts/pr-comment.py"
    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
      with:
        sarif_file: ${{ inputs.output }}/checkstead.sarif
        category: checkstead
branding:
  icon: "shield"
  color: "gray-dark"
