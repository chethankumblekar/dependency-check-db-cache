name: "Checkstead"
description: "Scan with the pinned OWASP Dependency-Check and the Checkstead snapshot. No NVD API key."
inputs:
  scan:
    description: "Path to scan, relative to the workspace."
    required: false
    default: "."
  project:
    description: "Name written on the report. Defaults to the directory name."
    required: false
    default: ""
  output:
    description: "Directory for the Checkstead report and the Dependency-Check reports."
    required: false
    default: "checkstead-report"
  config:
    description: "Optional path to checkstead.yml. When omitted, ./checkstead.yml is used if it exists."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      env:
        INPUT_SCAN: ${{ inputs.scan }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        docker build -t checkstead-action -f "$GITHUB_ACTION_PATH/Dockerfile" "$GITHUB_ACTION_PATH"
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/work" \
          -w /work \
          -e INPUT_SCAN \
          -e INPUT_PROJECT \
          -e INPUT_OUTPUT \
          -e INPUT_CONFIG \
          checkstead-action
    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}/checkstead.sarif
        category: checkstead
branding:
  icon: "shield"
  color: "gray-dark"
