[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkstead"
version = "0.1.0"
description = "Run OWASP Dependency-Check once, the same way, for every build."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Chethan K"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
checkstead = "checkstead.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
checkstead = ["engine.version"]
