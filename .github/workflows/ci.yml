name: CI

# Actions are pinned to commit SHAs. The trailing comment is the release tag.
# Update a pin with: gh api repos/<owner>/<name>/commits/<tag> --jq .sha
# Replace the SHA and the tag comment in the same change.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel a superseded run. A push can be publishing images,
  # so it is left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install lint and build tools
        # Versions live in pyproject.toml. A reviewed bump of ruff or build
        # updates that file; this step installs the same pins.
        run: python3 -m pip install --disable-pip-version-check '.[dev]'

      - name: Lint, build, and test
        run: bash ./scripts/self-test.sh

  images:
    name: Build images
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: checkstead
            file: Dockerfile
          - image: checkstead-server
            file: Dockerfile.server
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ matrix.image }}:ci

      - name: Fail on High and Critical language packages in the server image
        if: matrix.image == 'checkstead-server'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: checkstead-server:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: library
          severity: CRITICAL,HIGH
          scanners: vuln

      # Exception unfixed-os-2026-10-19, review 2027-01-19.
      # Scope: operating-system packages in these images that have no fixed version.
      # On checkstead-server@sha256:1a94da1ead8757e90d4df7ce4fff959f9319b1da617a4096c69186df0b301744
      # that is 61 unfixed High findings and 2 unfixed Critical findings:
      # CVE-2025-7458 (libsqlite3-0, affected, no fixed version) and
      # CVE-2023-45853 (zlib1g, will_not_fix, no fixed version).
      # ignore-unfixed: true is this exception. A fixed High or Critical OS
      # package still fails the step. This is not a .trivyignore file.
      # The six Dependency-Check jar findings stay in the report-only scan.
      # engine.version stays 13.0.0.
      - name: Fail on fixed High and Critical operating-system packages in the server image
        if: matrix.image == 'checkstead-server'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: checkstead-server:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Fail on language packages outside the pinned engine
        if: matrix.image == 'checkstead'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: checkstead:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: library
          severity: CRITICAL,HIGH
          skip-dirs: /opt/dependency-check
          scanners: vuln

      # Same exception unfixed-os-2026-10-19. Fixed High and Critical OS packages still fail.
      - name: Fail on fixed High and Critical operating-system packages in the scanner image
        if: matrix.image == 'checkstead'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: checkstead:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Write the scanner image vulnerability report
        if: matrix.image == 'checkstead'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: checkstead:ci
          format: json
          output: trivy-scanner.json
          exit-code: "0"
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload the scanner image report
        if: matrix.image == 'checkstead'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-scanner
          path: trivy-scanner.json

  publish-images:
    name: Publish images
    # Pull requests never reach this job. A branch push other than the default
    # branch does not publish either. Version tags and the default branch do.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: checkstead
            file: Dockerfile
            engine: true
          - image: checkstead-server
            file: Dockerfile.server
            engine: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read the engine pin
        id: pin
        run: echo "version=$(tr -d '[:space:]' < engine.version)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.image == 'checkstead-server'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=engine-${{ steps.pin.outputs.version }},enable=${{ matrix.engine && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.image == 'checkstead-server' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # The action defaults this to false, which stores the statement only
          # in the GitHub API. Container verification also needs it on the image.
          push-to-registry: true

      - name: Verify the GitHub provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          image="oci://ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}"
          ok=0
          for _ in 1 2 3 4 5 6; do
            if gh attestation verify "$image" --repo "${{ github.repository }}"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
