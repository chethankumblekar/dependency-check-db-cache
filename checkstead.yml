# Public snapshot manifest. A company updater replaces this URL.
snapshot: https://github.com/chethankumblekar/dependency-check-db-cache/releases/latest/download/manifest.json

# prefer-newest uses an NVD score when one is present, otherwise a CNA score,
# and otherwise another analyzer. The newer CVSS version from that source counts.
# highest uses the largest base score from any source.
scorePolicy: prefer-newest

# Empty does not fail the build on score.
threshold:

# true fails the build when a finding is on the CISA KEV list.
failOnKev: false

# true fails the build when a finding has no score.
failUnscored: false

# Optional. Blank, missing, or empty means no private rules.
# A local file that contains rules is applied. A URL is refused.
privateSuppressions:
