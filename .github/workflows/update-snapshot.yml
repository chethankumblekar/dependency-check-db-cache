name: Update database snapshot

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC. One run a day is inside NIST's enterprise refresh guidance.
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: checkstead-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish the daily snapshot
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/update-snapshot.sh

      - name: Upload updater log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-log
          path: build/snapshot/dependency-check.log
