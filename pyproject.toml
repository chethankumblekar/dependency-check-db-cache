[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "checkstead"
version = "0.1.0"
description = "Run OWASP Dependency-Check once, the same way, for every build."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# cryptography verifies snapshot signatures and signs the GitHub App token.
# It replaces calls to the openssl command, which Windows does not ship.
dependencies = ["certifi>=2024.2.2", "cryptography>=44.0.1"]
authors = [{name = "Chethan K"}]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["ruff==0.14.2", "build==1.3.0"]

[project.scripts]
checkstead = "checkstead.cli:main"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
checkstead = ["engine.version", "ui_page.html", "checkstead-public.xml", "snapshot_trust.json"]
