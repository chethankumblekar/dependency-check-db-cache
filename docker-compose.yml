services:
  checkstead:
    # Pin a digest for production, for example
    # ghcr.io/chethankumblekar/dependency-check-db-cache/checkstead-server@sha256:<digest>
    # from the CI run summary. :latest is for trying it out.
    image: ghcr.io/chethankumblekar/dependency-check-db-cache/checkstead-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - checkstead-data:/var/lib/checkstead
      - checkstead-scans:/var/lib/checkstead/scans
    environment:
      CHECKSTEAD_LOCAL: "1"
      CHECKSTEAD_SCANS: /var/lib/checkstead/scans
    # The server runs as uid 999 and needs no Linux capability.
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    pids_limit: 256
    env_file:
      - path: .env
        required: false

volumes:
  checkstead-data:
  checkstead-scans:
