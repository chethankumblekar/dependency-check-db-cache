name: Update database snapshot

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild the database from the NVD instead of updating the last snapshot."
        type: boolean
        default: false
      validate_only:
        description: "Run the update, canary, and signing against the real NVD without publishing a release."
        type: boolean
        default: false
  schedule:
    # 01:00 UTC. One run a day is inside NIST's enterprise refresh guidance.
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: checkstead-snapshot
  cancel-in-progress: false

jobs:
  publish:
    # The signing key and the NVD key belong in this environment's secrets,
    # with deployment limited to main, so a workflow on another branch cannot
    # read them. docs/operations/production-operations.md has the setup.
    environment: snapshot-signing
    runs-on: ubuntu-latest
    # An incremental update takes minutes. The weekly full rebuild took up to
    # 2.5 hours and three of ten runs before the seed was added hit 180.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Checkstead
        # The updater verifies the seed and signs the manifest with this package.
        run: python3 -m pip install --disable-pip-version-check .

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish the daily snapshot
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CHECKSTEAD_SNAPSHOT_SIGNING_KEY: ${{ secrets.CHECKSTEAD_SNAPSHOT_SIGNING_KEY }}
          CHECKSTEAD_SNAPSHOT_KEY_ID: ${{ vars.CHECKSTEAD_SNAPSHOT_KEY_ID }}
          CHECKSTEAD_FULL_REBUILD: ${{ inputs.full_rebuild && '1' || '' }}
          CHECKSTEAD_VALIDATE_ONLY: ${{ inputs.validate_only && '1' || '' }}
        run: bash ./scripts/update-snapshot.sh

      - name: Keep the validation output
        if: always() && inputs.validate_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-validation
          path: |
            build/snapshot/manifest.json
            build/snapshot/checkstead-db.zip.sha256
            build/snapshot/dependency-check.log
            build/snapshot/canary/out/dependency-check-report.json
          if-no-files-found: warn

      - name: Upload updater log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-log
          path: build/snapshot/dependency-check.log
