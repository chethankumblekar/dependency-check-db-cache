[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkstead"
version = "0.1.0"
description = "Run OWASP Dependency-Check once, the same way, for every build."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["certifi"]
authors = [{name = "Chethan K"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["ruff==0.14.2", "build==1.3.0"]

[project.scripts]
checkstead = "checkstead.cli:main"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
checkstead = ["engine.version", "ui_page.html", "checkstead-public.xml"]
